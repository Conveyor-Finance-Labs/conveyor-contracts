[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./addresses" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

# ── Environment profiles (single codebase, swap without code changes) — see docs/40·docs/50 ──
[profile.local-mock]      # Daily dev: LocalGmxMock + MockOracle, offline
[profile.local-fork]      # Integration testing: forked real GMX
[profile.gmx-devnet]      # Demo baseline: GMX testnet
[profile.mainnet-stage]   # Rehearsal: real GMX + Chainlink

[profile.ci]
verbosity = 3
fuzz = { runs = 2000 }
invariant = { runs = 512, depth = 64 }
